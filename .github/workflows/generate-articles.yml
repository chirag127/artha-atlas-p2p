name: Scheduled AI Article Generation

on:
  schedule:
    # Runs weekly on Monday at 04:00 UTC (optional recurring pipeline)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      ai_provider:
        description: 'AI Provider (gemini)'
        required: true
        default: 'gemini'
        type: choice
        options:
          - gemini
      model_name:
        description: 'Model Identifier'
        required: true
        default: 'gemini-1.5-pro'
      articles_per_run:
        description: 'Number of articles to generate (1-3)'
        required: true
        default: '1'
      require_manual_approval:
        description: 'Require Manual PR Approval before publishing'
        required: true
        default: true
        type: boolean
      allow_tax_articles:
        description: 'Allow automated tax articles (Default false for safety)'
        required: true
        default: false
        type: boolean
      allow_regulatory_articles:
        description: 'Allow automated regulatory articles (Default false for safety)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate Next Roadmap Article
    runs-on: ubuntu-latest
    if: github.repository_owner == 'chirag127'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scheduled Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'gemini' }}
          MODEL_NAME: ${{ github.event.inputs.model_name || 'gemini-1.5-pro' }}
          ARTICLES_PER_RUN: ${{ github.event.inputs.articles_per_run || '1' }}
          REQUIRE_MANUAL_APPROVAL: ${{ github.event.inputs.require_manual_approval || 'true' }}
          ALLOW_TAX_ARTICLES: ${{ github.event.inputs.allow_tax_articles || 'false' }}
          ALLOW_REGULATORY_ARTICLES: ${{ github.event.inputs.allow_regulatory_articles || 'false' }}
        run: node scripts/generate-scheduled-article.mjs

      - name: Validate Generated Article
        run: npm run validate:content

      - name: Run Calculation Tests
        run: npm run test:unit

      - name: Create Pull Request for Manual Review
        if: env.REQUIRE_MANUAL_APPROVAL == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat(content): automated draft article from editorial roadmap'
          title: 'Editorial Review: Automated Draft Article'
          body: |
            ## Automated Editorial Generation Summary
            This pull request contains newly generated draft articles from the ArthaAtlas P2P editorial roadmap.
            
            ### Quality Assurance Verification
            - [x] Schema and metadata validation passed (`npm run validate:content`)
            - [x] Mathematical and calculation unit tests passed (`npm run test:unit`)
            - [ ] Editor review of regulatory and tax claims
            - [ ] Source citation link verification
          branch: 'auto-content-draft'
          delete-branch: true
